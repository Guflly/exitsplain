name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: exitsplain-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: exitsplain-windows-x86_64.zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: exitsplain-macos-x86_64.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: exitsplain-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive
        if: runner.os != 'Windows'
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.archive }} exitsplain

      - name: Archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target\${{ matrix.target }}\release\exitsplain.exe" -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --generate-notes --verify-tag
